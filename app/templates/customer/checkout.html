{% extends 'base.html' %}
{% block title %}Checkout{% endblock %}

{% block content %}
<div class="tail-container max-w-2xl mx-auto px-6 py-12">
    <h2 class="text-3xl font-bold mb-8 text-center">Checkout</h2>
    
    <form id="checkout-form" class="space-y-6 bg-white p-8 rounded-2xl shadow">
        <div>
            <label class="block text-sm font-medium mb-2">Full Name *</label>
            <input type="text" id="name" required class="w-full border rounded-lg px-4 py-3">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Phone Number *</label>
            <input type="tel" id="phone" required class="w-full border rounded-lg px-4 py-3">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Delivery Location *</label>
            <textarea id="location" required rows="3" class="w-full border rounded-lg px-4 py-3"></textarea>
        </div>

        <div class="pt-6 border-t">
            <div class="flex justify-between text-xl mb-6">
                <span class="font-semibold">Total Amount</span>
                <span id="total-amount" class="font-bold text-2xl text-amber-800">KSh 0</span>
            </div>
            
            <button type="submit" id="submit-btn"
                    class="w-full bg-green-700 hover:bg-green-800 text-white py-4 rounded-xl text-lg font-semibold">
                Place Order
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/main.js"></script>
{% endblock %}
